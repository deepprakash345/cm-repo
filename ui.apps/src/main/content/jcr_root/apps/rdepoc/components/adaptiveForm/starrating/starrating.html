<sly data-sly-use.renderer="starrating.js"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"
     data-sly-use.label="${renderer.labelPath}"
     data-sly-use.shortDescription="${renderer.shortDescriptionPath}"
     data-sly-use.longDescription="${renderer.longDescriptionPath}"
     data-sly-use.errorMessage="${renderer.errorMessagePath}"
     data-sly-use.questionMark="${renderer.questionMarkPath}"
     data-sly-use.formstructparser="com.adobe.cq.forms.core.components.models.form.FormStructureParser"
     data-sly-use.starrating="com.rdepoc.core.models.forms.StarRating"/>
<sly data-sly-call="${clientlib.all @ categories='rdepoc.forms.starrating.v1.runtime'}"/>
<div class="cmp-adaptiveform-starrating"
     id="${starrating.id}"
     data-cmp-is="adaptiveFormStarRating"
     data-cmp-visible="${starrating.visible ? 'true' : 'false'}"
     data-cmp-enabled="${starrating.enabled ? 'true' : 'false'}"
     data-cmp-required="${starrating.required ? 'true' : 'false'}"
     data-cmp-readonly="${starrating.readOnly ? 'true' : 'false'}"
     data-cmp-data-layer="${starrating.data.json}"
     data-cmp-adaptiveformcontainer-path="${formstructparser.formContainerPath}"
     data-sly-test.widgetId="${'{0}-{1}' @ format=[starrating.id, 'widget']}">
    <div class="cmp-adaptiveform-starrating__label-container">
        <span id="${starrating.id}__label">
            <sly data-sly-call="${label.label @ componentId=widgetId, labelValue=starrating.label.value, labelVisible=starrating.label.visible, labelRichText=starrating.label.richText, bemBlock='cmp-adaptiveform-starrating'}"/>
        </span>
        <sly data-sly-call="${questionMark.questionMark @ componentId=starrating.id, longDescription=starrating.description, bemBlock='cmp-adaptiveform-starrating'}"/>
    </div>
    <!--/* The Core field base uses this numeric widget; the radios are its accessible view. */-->
    <input class="cmp-adaptiveform-starrating__widget" id="${widgetId}"
           type="number" name="${starrating.name}" value="${starrating.default[0]}"
           min="1" max="${starrating.maximum}" step="1" hidden
           disabled="${!starrating.enabled}" readonly="${starrating.readOnly}"/>
    <div class="cmp-adaptiveform-starrating__group" role="radiogroup"
         aria-label="${starrating.screenReaderText || (!starrating.label.visible ? starrating.htmlScreenReaderText : '')}"
         aria-labelledby="${starrating.label.visible && !starrating.screenReaderText ? '{0}__label' : '' @ format=[starrating.id]}"
         aria-required="${starrating.required ? 'true' : 'false'}"
         aria-readonly="${starrating.readOnly ? 'true' : 'false'}"
         aria-invalid="false"
         aria-describedby="${'{0}__shortdescription {0}__longdescription {0}__errormessage' @ format=[starrating.id]}">
        <label class="cmp-adaptiveform-starrating__option" data-sly-repeat.star="${starrating.starValues}"
               data-filled="${starrating.selectedRating >= star ? 'true' : 'false'}">
            <input class="cmp-adaptiveform-starrating__radio" type="radio"
                   name="${starrating.id}-rating" value="${star}"
                   aria-label="${'{0} of {1} stars' @ i18n, format=[star, starrating.maximum]}"
                   checked="${starrating.selectedRating == star}"
                   disabled="${!starrating.enabled}"
                   required="${starrating.required}"/>
            <svg class="cmp-adaptiveform-starrating__star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path d="M12 2L15 8.5L22 9.5L17 14.5L18.2 22L12 18.5L5.8 22L7 14.5L2 9.5L9 8.5Z"/>
            </svg>
        </label>
    </div>
    <button class="cmp-adaptiveform-starrating__clear" type="button"
            hidden="${starrating.required}" disabled="${!starrating.enabled || starrating.readOnly}">
        ${'Clear rating' @ i18n}
    </button>
    <sly data-sly-call="${shortDescription.shortDescription @ componentId=starrating.id, shortDescriptionVisible=starrating.tooltipVisible, shortDescription=starrating.tooltip, bemBlock='cmp-adaptiveform-starrating'}"/>
    <sly data-sly-call="${longDescription.longDescription @ componentId=starrating.id, longDescription=starrating.description, bemBlock='cmp-adaptiveform-starrating'}"/>
    <sly data-sly-call="${errorMessage.errorMessage @ componentId=starrating.id, bemBlock='cmp-adaptiveform-starrating'}"/>
</div>
